name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: shellcheck lineaje-verify.sh
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/tests.yml

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile lineaje_scan_gh.py
      - run: bash -n lineaje-verify.sh

  composite-validation:
    name: Composite validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing org before setup
        id: invalid-input
        continue-on-error: true
        uses: ./
        with:
          scan_type: image
          org_name: ""
          image: example.invalid/image:latest
          lineaje_cli_token: unused
      - name: Assert validation failure
        env:
          OUTCOME: ${{ steps.invalid-input.outcome }}
        run: test "$OUTCOME" = failure