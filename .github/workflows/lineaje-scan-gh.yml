name: Lineaje Scan

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan type: image or source"
        required: true
        type: choice
        options: [image, source]
      project_name:
        required: false
      project_version:
        required: false
      version_prefix:
        required: false
      org_name:
        required: false
      lineaje_cli_token:
        required: false
      output_dir:
        required: false
        default: "/tmp/lineaje-scan-output"
      image:
        required: false
      metafiles:
        required: false
        default: "Dockerfile"
      image_source_type:
        required: false
        default: "daemon"
        type: choice
        options: [daemon, registry]
      source_dir:
        required: false
        default: "."
      language:
        required: false
        type: choice
        options: [java, python, node, dotnet, golang, rust]
      language_version:
        required: false
      matching_ref:
        required: false
      pip_extra_index_url:
        required: false
      identity_url:
        description: "Endpoint override: identity service (leave all six blank for prod)"
        required: false
      scim_url:
        description: "Endpoint override: SCIM service"
        required: false
      scm_url:
        description: "Endpoint override: SCM service"
        required: false
      notification_url:
        description: "Endpoint override: notification service"
        required: false
      data_service_url:
        description: "Endpoint override: data service"
        required: false
      gpt_service_url:
        description: "Endpoint override: GPT service (fix plan)"
        required: false
      post_scan:
        required: false
        default: "scan_only"
        type: choice
        options: [scan_only, fix_plan, fix_plan_gos_compat]
      fast_scan:
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      gos_mode:
        required: false
        default: "observe"
        type: choice
        options: [observe, enforce]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./
        with:
          scan_type:                  ${{ inputs.scan_type }}
          project_name:               ${{ inputs.project_name }}
          project_version:            ${{ inputs.project_version }}
          version_prefix:             ${{ inputs.version_prefix }}
          org_name:                   ${{ inputs.org_name }}
          lineaje_cli_token:          ${{ inputs.lineaje_cli_token || secrets.LINEAJE_CLI_TOKEN }}
          output_dir:                 ${{ inputs.output_dir }}
          image:                      ${{ inputs.image }}
          metafiles:                  ${{ inputs.metafiles }}
          image_source_type:          ${{ inputs.image_source_type }}
          source_dir:                 ${{ inputs.source_dir }}
          language:                   ${{ inputs.language }}
          language_version:           ${{ inputs.language_version }}
          matching_ref:               ${{ inputs.matching_ref }}
          pip_extra_index_url:        ${{ inputs.pip_extra_index_url }}
          identity_url:               ${{ inputs.identity_url }}
          scim_url:                   ${{ inputs.scim_url }}
          scm_url:                    ${{ inputs.scm_url }}
          notification_url:           ${{ inputs.notification_url }}
          data_service_url:           ${{ inputs.data_service_url }}
          gpt_service_url:            ${{ inputs.gpt_service_url }}
          post_scan:                  ${{ inputs.post_scan }}
          fast_scan:                  ${{ inputs.fast_scan }}
          gos_mode:                   ${{ inputs.gos_mode }}
