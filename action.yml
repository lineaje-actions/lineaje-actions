name: 'Lineaje Scan'
description: 'Scan container images and source code for vulnerabilities using Lineaje'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  # ── Common ──────────────────────────────────────────────────────────────────
  scan_type:
    description: "Scan type: image or source"
    required: true
  project_name:
    description: "Project name (defaults to repository name)"
    required: false
    default: ''
  project_version:
    description: "Project version (defaults to scan_type-run_number-run_attempt)"
    required: false
    default: ''
  version_prefix:
    description: "Prefix prepended to the auto-generated version (e.g. 'nginx' → 'nginx-image-42-1'). Ignored when project_version is set."
    required: false
    default: ''
  org_name:
    description: "Lineaje org name (auto-derived from token if omitted)"
    required: false
    default: ''
  lineaje_cli_token:
    description: "Lineaje token"
    required: true
  output_dir:
    description: "Output directory for veecli"
    required: false
    default: "/tmp/lineaje-scan-output"
  veecli_url:
    description: "URL to download the veecli tarball from (override for dev/staging builds)"
    required: false
    default: "https://downloads.prod.veedna.com/veecli_latest.tar.gz"
  identity_url:
    description: "Identity/auth service base URL (override for dev/staging; default: LineajeAuthService from the veecli tarball's config-orig.json)"
    required: false
    default: ''
  gpt_service_url:
    description: "GPT (fix plan) service base URL (override for dev/staging; default: GPTServiceHost from config-orig.json)"
    required: false
    default: ''
  scim_url:
    description: "SCIM service base URL (override for dev/staging; default: SCIMHost from config-orig.json). veecli calls this directly during collect to resolve company details — must match identity_url's environment or collection fails."
    required: false
    default: ''
  data_service_url:
    description: "Data/GraphQL service base URL (override for dev/staging; default: GraphQLServiceHost from config-orig.json)"
    required: false
    default: ''
  scm_url:
    description: "SCM service base URL (override for dev/staging; default: SCMHost from config-orig.json)"
    required: false
    default: ''
  notification_url:
    description: "Notification service base URL (override for dev/staging; default: NotificationServiceHost from config-orig.json)"
    required: false
    default: ''

  # ── Image scan ──────────────────────────────────────────────────────────────
  image:
    description: "[image] Container image reference (e.g. docker.io/library/python:3.8-slim)"
    required: false
    default: ''
  metafiles:
    description: "[image] Path to Dockerfile (required when post_scan=fix_plan; needed to generate patched Dockerfile)"
    required: false
    default: ''
  image_source_type:
    description: "[image] Image source: daemon (already in local Docker) | registry (pull first)"
    required: false
    default: "daemon"

  # ── Source scan ─────────────────────────────────────────────────────────────
  source_dir:
    description: "[source] Path to the source directory relative to repo root"
    required: false
    default: '.'
  language:
    description: "[source] Runtime to install: java | python | node | dotnet | golang | rust"
    required: false
    default: ''
  language_version:
    description: "[source] Version to install (required if language set). java: '17', python: '3.10', node: '18' | '20' | '22' | '24' | '26', dotnet: '8.0', golang: '1.18' | '1.19' | '1.20' | '1.21' | '1.22' | '1.23' | '1.24' | '1.25' | '1.26', rust: e.g. '1.75.0' (a real rustup toolchain version)"
    required: false
    default: ''
  matching_ref:
    description: "[source] Branch/tag/commit being scanned (defaults to current branch)"
    required: false
    default: ''
  pip_extra_index_url:
    description: "[source/python] Space-separated list of extra pip index URLs for resolving private packages (sets PIP_EXTRA_INDEX_URL). Include credentials in the URL, e.g. https://user:token@registry.example.com/simple/"
    required: false
    default: ''

  # ── Post-scan ────────────────────────────────────────────────────────────────
  post_scan:
    description: "scan_only | fix_plan"
    required: false
    default: "scan_only"

  # ── Scan behaviour ───────────────────────────────────────────────────────────
  fast_scan:
    description: "Enable fast scan mode (true | false). Defaults to true. Set to false for a deeper but slower scan."
    required: false
    default: "true"
  gos_mode:
    description: "GOS premium registry mode: observe | enforce"
    required: false
    default: "observe"

outputs:
  fix_artifact_uploaded:
    description: "Whether a fix plan artifact was produced and uploaded (true/false). Image: patched Dockerfile. Source: pom.xml / requirements.txt / package.json / build.gradle etc."
    value: ${{ steps.lineaje_scan.outputs.fix_artifact_uploaded }}
  patched_dockerfile:
    description: "Absolute path to the patched Dockerfile on the runner (image scan + fix_plan only). Empty string otherwise."
    value: ${{ steps.lineaje_scan.outputs.patched_dockerfile }}
  ech_count:
    description: "Combined count of Exploited + Critical + High vulnerabilities (ECH). Zero means the image meets the gold criteria."
    value: ${{ steps.lineaje_scan.outputs.ech_count }}
  premium_only:
    description: "True when a fix plan was produced and every available fix is premium type (no curated fixes). False otherwise."
    value: ${{ steps.lineaje_scan.outputs.premium_only }}

runs:
  using: "composite"
  steps:
    # ── 1. Validate image scan inputs ─────────────────────────────────────────
    - name: Validate image scan inputs
      if: inputs.scan_type == 'image'
      shell: bash
      run: |
        if [ -z "${{ inputs.image }}" ]; then
          echo "[error] 'image' input is required for image scan"
          exit 1
        fi
        if [ "${{ inputs.post_scan }}" = "fix_plan" ]; then
          if [ -z "${{ inputs.metafiles }}" ]; then
            echo "[error] 'metafiles' input is required for image scan with post_scan=fix_plan (path to Dockerfile)"
            exit 1
          fi
          if [ ! -f "${{ inputs.metafiles }}" ]; then
            echo "[error] metafiles not found: ${{ inputs.metafiles }}"
            exit 1
          fi
        fi

    # ── 1b. Validate source scan inputs ───────────────────────────────────────
    - name: Validate source scan inputs
      if: inputs.scan_type == 'source'
      shell: bash
      run: |
        if [ -z "${{ inputs.language }}" ]; then
          echo "[error] 'language' input is required for source scan (java | python | node | dotnet | golang | rust)"
          exit 1
        fi
        if [ -z "${{ inputs.language_version }}" ]; then
          echo "[error] 'language_version' input is required for source scan"
          exit 1
        fi
        if [ "${{ inputs.language }}" = "golang" ] && [ "${{ inputs.post_scan }}" = "fix_plan" ]; then
          echo "[warn] fix_plan is not yet supported for Go — falling back to scan_only"
          echo "POST_SCAN_EFFECTIVE=scan_only" >> "$GITHUB_ENV"
        else
          echo "POST_SCAN_EFFECTIVE=${{ inputs.post_scan }}" >> "$GITHUB_ENV"
        fi

    # ── 2. Download and extract veecli ────────────────────────────────────────
    - name: Download and extract veecli
      shell: bash
      run: |
        # Reuse veecli if already set up by an earlier action call in this job.
        # CONFIG_ORIG_PATH is already in $GITHUB_ENV from the first call — don't overwrite it.
        if [ -x /opt/veecli/veecli ]; then
          echo "VEECLI_ALREADY_SETUP=true" >> "$GITHUB_ENV"
          echo "VEECLI_PATH=$(realpath /opt/veecli/veecli)" >> "$GITHUB_ENV"
          exit 0
        fi

        EXTRACT_DIR=$(mktemp -d /tmp/veecli-extract-XXXXXX)
        curl -fL "${{ inputs.veecli_url }}" -o "$EXTRACT_DIR/veecli.tar.gz"
        tar -xzf "$EXTRACT_DIR/veecli.tar.gz" -C "$EXTRACT_DIR"

        VEECLI_BIN=$(find "$EXTRACT_DIR" -name 'veecli' -not -name '*.tar.gz' -type f | head -1)
        if [ -z "$VEECLI_BIN" ]; then
          echo "[error] veecli binary not found after extraction"
          exit 1
        fi
        chmod +x "$VEECLI_BIN"
        echo "VEECLI_PATH=$(realpath "$VEECLI_BIN")" >> "$GITHUB_ENV"

        CONFIG_ORIG=$(find "$EXTRACT_DIR" -name 'config-orig.json' -type f | head -1)
        if [ -z "$CONFIG_ORIG" ]; then
          echo "[error] config-orig.json not found after extraction"
          exit 1
        fi
        echo "CONFIG_ORIG_PATH=$(realpath "$CONFIG_ORIG")" >> "$GITHUB_ENV"

    # ── 3. Symlink veecli to /opt/veecli ──────────────────────────────────────
    - name: Symlink veecli to /opt/veecli
      if: env.VEECLI_ALREADY_SETUP != 'true'
      shell: bash
      run: sudo rm -f /opt/veecli && sudo ln -s "$(dirname "$VEECLI_PATH")" /opt/veecli

    # ── 4. Cache veecli runtimes ──────────────────────────────────────────────
    - name: Cache veecli runtimes
      if: inputs.scan_type == 'source'
      uses: actions/cache@v4
      with:
        path: /opt/veecli/third_party/linux
        key: veecli-runtimes-${{ inputs.language }}-${{ inputs.language_version }}-cdxgomod-1.10.0-3-lineaje

    # ── 4b. Install dotnet ────────────────────────────────────────────────────
    - name: Install dotnet
      if: inputs.scan_type == 'source' && inputs.language == 'dotnet' && env.VEECLI_ALREADY_SETUP != 'true'
      shell: bash
      run: |
        pushd /opt/veecli > /dev/null
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x ./dotnet-install.sh
        mkdir -p /opt/veecli/third_party/linux/dotnet
        bash ./dotnet-install.sh --install-dir /opt/veecli/third_party/linux/dotnet -c 10.0 > /dev/null 2>&1
        bash ./dotnet-install.sh --install-dir /opt/veecli/third_party/linux/dotnet -c 9.0 > /dev/null 2>&1
        bash ./dotnet-install.sh --install-dir /opt/veecli/third_party/linux/dotnet -c 8.0 > /dev/null 2>&1
        bash ./dotnet-install.sh --install-dir /opt/veecli/third_party/linux/dotnet -c 7.0 > /dev/null 2>&1
        bash ./dotnet-install.sh --install-dir /opt/veecli/third_party/linux/dotnet -c 6.0 > /dev/null 2>&1
        rm dotnet-install.sh
        mkdir -p /opt/veecli/third_party/linux/cyclonedx-dotnet
        /opt/veecli/third_party/linux/dotnet/dotnet tool install \
          --tool-path /opt/veecli/third_party/linux/cyclonedx-dotnet \
          --version 2.7.0 CycloneDX
        popd > /dev/null

        sudo tee -a /etc/profile.d/lineaje-env.sh >/dev/null <<'EOF'

        # .NET
        export DOTNET_ROOT=/opt/veecli/third_party/linux/dotnet
        export DOTNET_CLI_HOME=/opt/veecli/third_party/linux/dotnet
        export PATH="$PATH:/opt/veecli/third_party/linux/dotnet:/opt/veecli/third_party/linux/dotnet/tools"
        EOF

        echo "DOTNET_ROOT=/opt/veecli/third_party/linux/dotnet" >> "$GITHUB_ENV"
        echo "DOTNET_CLI_HOME=/opt/veecli/third_party/linux/dotnet" >> "$GITHUB_ENV"
        echo "/opt/veecli/third_party/linux/dotnet" >> "$GITHUB_PATH"
        echo "/opt/veecli/third_party/linux/dotnet/tools" >> "$GITHUB_PATH"

    # ── 4c. Install rust ───────────────────────────────────────────────────────
    - name: Install rust
      if: inputs.scan_type == 'source' && inputs.language == 'rust' && env.VEECLI_ALREADY_SETUP != 'true'
      shell: bash
      run: |
        pushd /opt/veecli > /dev/null
        export RUSTUP_HOME=/opt/veecli/third_party/linux/rustup
        export CARGO_HOME=/opt/veecli/third_party/linux/cargo

        curl -s https://sh.rustup.rs -o rust.sh
        bash rust.sh -y -q --default-toolchain none > /dev/null 2>&1
        rm rust.sh

        "$CARGO_HOME/bin/rustup" toolchain install "${{ inputs.language_version }}" --profile minimal
        "$CARGO_HOME/bin/rustup" default "${{ inputs.language_version }}"

        "$CARGO_HOME/bin/cargo" install -q --root "$CARGO_HOME" cargo-lock --features=cli

        # Installing coldsnap for scanning AMIs
        # https://github.com/awslabs/coldsnap
        "$CARGO_HOME/bin/cargo" install --locked --root "$CARGO_HOME" coldsnap
        popd > /dev/null

        sudo tee -a /etc/profile.d/lineaje-env.sh >/dev/null <<'EOF'

        # Rust / Cargo
        export RUSTUP_HOME=/opt/veecli/third_party/linux/rustup
        export CARGO_HOME=/opt/veecli/third_party/linux/cargo
        EOF

        echo "RUSTUP_HOME=/opt/veecli/third_party/linux/rustup" >> "$GITHUB_ENV"
        echo "CARGO_HOME=/opt/veecli/third_party/linux/cargo" >> "$GITHUB_ENV"
        echo "/opt/veecli/third_party/linux/cargo/bin" >> "$GITHUB_PATH"

    # ── 5. Run pre.sh ─────────────────────────────────────────────────────────
    - name: Run pre.sh
      if: env.VEECLI_ALREADY_SETUP != 'true'
      shell: bash
      run: |
        PRE_SH="/opt/veecli/pre.sh"
        if [ ! -f "$PRE_SH" ]; then
          echo "[error] pre.sh not found at $PRE_SH"
          exit 1
        fi
        chmod +x "$PRE_SH"
        "$PRE_SH"

    # ── 6. Pull image (registry mode) ─────────────────────────────────────────
    - name: Pull image
      if: inputs.scan_type == 'image' && inputs.image_source_type == 'registry'
      shell: bash
      run: docker pull "${{ inputs.image }}"

    # ── 8. Resolve source directory ───────────────────────────────────────────
    - name: Resolve source directory
      if: inputs.scan_type == 'source'
      shell: bash
      run: |
        SOURCE_DIR="${{ inputs.source_dir }}"
        if [ ! -d "$SOURCE_DIR" ]; then
          echo "[error] Source directory not found: $SOURCE_DIR"
          exit 1
        fi
        echo "SOURCE_FOLDER=$(realpath "$SOURCE_DIR")" >> "$GITHUB_ENV"

    # ── 9. Install Python dependencies ───────────────────────────────────────
    - name: Install Python dependencies
      if: env.VEECLI_ALREADY_SETUP != 'true'
      shell: bash
      run: |
        python3 -m venv "${{ github.action_path }}/.venv"
        source "${{ github.action_path }}/.venv/bin/activate"
        pip install --quiet requests

    # ── 10. Resolve dynamic env vars ─────────────────────────────────────────
    - name: Set scan env vars
      shell: bash
      run: |
        echo "PROJECT_NAME=${{ inputs.project_name || github.event.repository.name }}" >> "$GITHUB_ENV"
        if [ -n "${{ inputs.project_version }}" ]; then
          echo "PROJECT_VERSION=${{ inputs.project_version }}" >> "$GITHUB_ENV"
        else
          PREFIX="${{ inputs.version_prefix }}"
          BASE="${{ inputs.scan_type }}-${{ github.run_number }}-${{ github.run_attempt }}"
          SUFFIX=""
          [ "$VEECLI_ALREADY_SETUP" = "true" ] && SUFFIX="-patched"
          if [ -n "$PREFIX" ]; then
            echo "PROJECT_VERSION=${PREFIX}-${BASE}${SUFFIX}" >> "$GITHUB_ENV"
          else
            echo "PROJECT_VERSION=${BASE}${SUFFIX}" >> "$GITHUB_ENV"
          fi
        fi
        echo "SRC_URL=${{ github.server_url }}/${{ github.repository }}" >> "$GITHUB_ENV"
        echo "MATCHING_REF=${{ inputs.matching_ref || github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
        echo "OUTPUT_DIR=${{ inputs.output_dir }}" >> "$GITHUB_ENV"

    # ── 11. Run Lineaje scan ──────────────────────────────────────────────────
    - name: Lineaje scan
      id: lineaje_scan
      shell: bash
      env:
        REFRESH_TOKEN: ${{ inputs.lineaje_cli_token }}
        PIP_EXTRA_INDEX_URL: ${{ inputs.pip_extra_index_url }}
      run: |
        if [ -z "$REFRESH_TOKEN" ]; then
          echo "[error] lineaje_cli_token input is required"
          exit 1
        fi

        source "${{ github.action_path }}/.venv/bin/activate"

        SCAN_ARGS=(
          --name          "$PROJECT_NAME"
          --version       "$PROJECT_VERSION"
          --refresh-token "$REFRESH_TOKEN"
          --config-orig   "$CONFIG_ORIG_PATH"
          --veecli        "$VEECLI_PATH"
          --output-dir    "$OUTPUT_DIR"
        )
        if [ -n "${{ inputs.org_name }}" ]; then
          SCAN_ARGS+=(--org-name "${{ inputs.org_name }}")
        fi
        if [ -n "${{ inputs.identity_url }}" ]; then
          SCAN_ARGS+=(--auth-service "${{ inputs.identity_url }}")
        fi
        if [ -n "${{ inputs.gpt_service_url }}" ]; then
          SCAN_ARGS+=(--gpt-host "${{ inputs.gpt_service_url }}")
        fi
        if [ -n "${{ inputs.scim_url }}" ]; then
          SCAN_ARGS+=(--scim-host "${{ inputs.scim_url }}")
        fi
        if [ -n "${{ inputs.data_service_url }}" ]; then
          SCAN_ARGS+=(--data-host "${{ inputs.data_service_url }}")
        fi
        if [ -n "${{ inputs.scm_url }}" ]; then
          SCAN_ARGS+=(--scm-host "${{ inputs.scm_url }}")
        fi
        if [ -n "${{ inputs.notification_url }}" ]; then
          SCAN_ARGS+=(--notification-host "${{ inputs.notification_url }}")
        fi

        if [ "${{ inputs.scan_type }}" = "image" ]; then
          SCAN_ARGS+=(
            --image             "${{ inputs.image }}"
            --metafiles         "${{ inputs.metafiles }}"
            --image-source-type "${{ inputs.image_source_type }}"
          )
        else
          SCAN_ARGS+=(
            --src-folder       "$SOURCE_FOLDER"
            --src-url          "$SRC_URL"
            --matching-ref     "$MATCHING_REF"
            --language         "${{ inputs.language }}"
            --language-version "${{ inputs.language_version }}"
          )
        fi

        if [ "${POST_SCAN_EFFECTIVE:-${{ inputs.post_scan }}}" = "scan_only" ]; then
          SCAN_ARGS+=(--skip-fix-plan)
        fi

        if [ "${{ inputs.fast_scan }}" = "true" ]; then
          SCAN_ARGS+=(--fast-scan)
        fi

        SCAN_ARGS+=(--gos-mode "${{ inputs.gos_mode }}")

        # Pipe stdout+stderr through tee so logs still stream to the console AND are
        # captured for post-processing. PIPESTATUS[0] preserves the Python exit code.
        SCAN_LOG="/tmp/lineaje-scan.log"
        python3 -u "${{ github.action_path }}/lineaje_scan_gh.py" "${SCAN_ARGS[@]}" 2>&1 | tee "$SCAN_LOG"
        SCAN_EXIT=${PIPESTATUS[0]}

        # Detect fix plan artifact
        ARTIFACT_FOUND=false
        PATCHED_DOCKERFILE=""
        if [ "${POST_SCAN_EFFECTIVE:-${{ inputs.post_scan }}}" != "scan_only" ]; then
          if [ "${{ inputs.scan_type }}" = "image" ]; then
            PATCHED_DOCKERFILE=$(find "$OUTPUT_DIR" -maxdepth 1 -name 'Dockerfile*' | head -1)
            [ -n "$PATCHED_DOCKERFILE" ] && ARTIFACT_FOUND=true
          else
            for pattern in 'pom.xml' 'build.gradle' 'build.gradle.kts' 'requirements.txt' 'Pipfile' 'pyproject.toml' 'package.json' 'package-lock.json'; do
              if find "$OUTPUT_DIR" -maxdepth 1 -name "$pattern" | grep -q .; then
                ARTIFACT_FOUND=true
                break
              fi
            done
          fi
        fi

        # Parse E+C+H counts and sum them — gold criteria is ECH = 0
        _E=$(awk '/[[:space:]]Exploited:/{print $NF; exit}' "$SCAN_LOG" 2>/dev/null); _E=${_E:-0}
        _C=$(awk '/[[:space:]]Critical:/{print $NF; exit}'  "$SCAN_LOG" 2>/dev/null); _C=${_C:-0}
        _H=$(awk '/[[:space:]]High:/{print $NF; exit}'      "$SCAN_LOG" 2>/dev/null); _H=${_H:-0}
        ECH_COUNT=$(( _E + _C + _H ))
        echo "ech_count: ${ECH_COUNT}  (Exploited=${_E} Critical=${_C} High=${_H})"
        PREMIUM_ONLY=$(awk '/[[:space:]]Premium only:/{print $NF; exit}' "$SCAN_LOG" 2>/dev/null); PREMIUM_ONLY=${PREMIUM_ONLY:-false}
        rm -f "$SCAN_LOG"

        echo "fix_artifact_uploaded=$ARTIFACT_FOUND" >> "$GITHUB_OUTPUT"
        echo "patched_dockerfile=$PATCHED_DOCKERFILE" >> "$GITHUB_OUTPUT"
        echo "ech_count=${ECH_COUNT}" >> "$GITHUB_OUTPUT"
        echo "premium_only=${PREMIUM_ONLY}" >> "$GITHUB_OUTPUT"

        [ "$SCAN_EXIT" -eq 0 ] || exit "$SCAN_EXIT"

    # ── 12. Upload fix plan artifact (image scan: patched Dockerfile) ─────────
    - name: Upload patched Dockerfile
      if: inputs.scan_type == 'image' && steps.lineaje_scan.outputs.fix_artifact_uploaded == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: patched-dockerfile
        path: ${{ inputs.output_dir }}/Dockerfile*
        if-no-files-found: ignore

    # ── 13. Upload fix plan artifact (source scan: pom.xml, requirements.txt, etc.)
    - name: Upload fix plan artifacts
      if: inputs.scan_type == 'source' && steps.lineaje_scan.outputs.fix_artifact_uploaded == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: lineaje-fix-plan
        path: |
          ${{ inputs.output_dir }}/pom.xml
          ${{ inputs.output_dir }}/build.gradle
          ${{ inputs.output_dir }}/build.gradle.kts
          ${{ inputs.output_dir }}/requirements.txt
          ${{ inputs.output_dir }}/Pipfile
          ${{ inputs.output_dir }}/pyproject.toml
          ${{ inputs.output_dir }}/package.json
          ${{ inputs.output_dir }}/package-lock.json
        if-no-files-found: ignore
